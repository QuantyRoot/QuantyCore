name: CI

on:
  push:
    branches: [main]
  pull_request:
  # By hand, so a rerun never needs a commit nobody wanted.
  workflow_dispatch:

# The toolchain is pinned, not tracked: with -D warnings every new stable
# lint would otherwise break an unrelated commit. Raising it is its own
# commit. The MSRV job is the promise, not the ceiling.
env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: fmt + clippy + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: tests
        run: cargo test --workspace

  hpack-corpus:
    name: HPACK against 14 recorded encoders
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - name: fetch the corpus at a pinned commit
        run: |
          git clone --quiet https://github.com/http2jp/hpack-test-case "$RUNNER_TEMP/hpack-test-case"
          git -C "$RUNNER_TEMP/hpack-test-case" checkout --quiet 8a1406e7d14bfcb6c046021f13cc15cfb162726d
      - name: decode every story
        run: cargo test --release --test hpack_corpus -- --nocapture
        env:
          QUANTY_HPACK_CASES: ${{ runner.temp }}/hpack-test-case

  json-suite:
    name: JSON against JSONTestSuite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - name: fetch the suite at a pinned commit
        run: |
          git clone --quiet https://github.com/nst/JSONTestSuite "$RUNNER_TEMP/JSONTestSuite"
          git -C "$RUNNER_TEMP/JSONTestSuite" checkout --quiet 1ef36fa01286573e846ac449e8683f8833c5b26a
      - run: cargo test --release --test json_suite -- --nocapture
        env:
          QUANTY_JSON_SUITE: ${{ runner.temp }}/JSONTestSuite/test_parsing

  msrv:
    name: test on MSRV (1.89)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89
      - run: cargo test --workspace --locked

  # NIST ACVP and Wycheproof at pinned commits, CAVP by checksum. Bumping a pin is its own
  # commit, so a changed vector never arrives together with changed code.
  tls-vectors:
    name: TLS primitives against NIST ACVP, CAVP and Wycheproof
    runs-on: ubuntu-latest
    env:
      ACVP_COMMIT: 975de31eb83d87039ec88934fdc47d8c312b892d
      WYCHEPROOF_COMMIT: 7a325932231bd7a724c791c8b0d65ea4d6d2f435
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - name: fetch the vector suites
        run: tests/tls_fetch_vectors.sh "$RUNNER_TEMP"
      - name: every vector, including the 1 to 8 GiB messages
        run: cargo test --release --test tls_vectors -- --nocapture
        env:
          QUANTY_VECTORS_REQUIRED: 1
          QUANTY_ACVP: ${{ runner.temp }}/acvp/gen-val/json-files
          QUANTY_WYCHEPROOF: ${{ runner.temp }}/wycheproof/testvectors_v1
          QUANTY_CAVP: ${{ runner.temp }}/cavp
          QUANTY_ACVP_LDT: 1
      - name: the handshake against the RFC 8448 traces
        run: cargo test --release --lib tls::rfc8448 -- --nocapture
        env:
          QUANTY_VECTORS_REQUIRED: 1
          QUANTY_RFC8448: ${{ runner.temp }}/rfc/rfc8448.txt

  tls-mutants:
    name: TLS tests fail on deliberately broken code
    runs-on: ubuntu-latest
    env:
      ACVP_COMMIT: 975de31eb83d87039ec88934fdc47d8c312b892d
      WYCHEPROOF_COMMIT: 7a325932231bd7a724c791c8b0d65ea4d6d2f435
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - name: fetch the vector suites
        run: tests/tls_fetch_vectors.sh "$RUNNER_TEMP"
      - name: every mutant must be killed by its test
        run: tests/tls_mutants.py
        env:
          QUANTY_VECTORS_REQUIRED: 1
          QUANTY_ACVP: ${{ runner.temp }}/acvp/gen-val/json-files
          QUANTY_WYCHEPROOF: ${{ runner.temp }}/wycheproof/testvectors_v1
          QUANTY_CAVP: ${{ runner.temp }}/cavp
          QUANTY_RFC8448: ${{ runner.temp }}/rfc/rfc8448.txt
          QUANTY_ACVP_LDT: 1
