name: CI

on:
  push:
    branches: [main]
  pull_request:
  # By hand, so a rerun never needs a commit nobody wanted.
  workflow_dispatch:

# The toolchain is pinned, not tracked: with -D warnings every new stable
# lint would otherwise break an unrelated commit. Raising it is its own
# commit. The MSRV job is the promise, not the ceiling.
env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: fmt + clippy + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: tests
        run: cargo test --workspace

  hpack-corpus:
    name: HPACK against 14 recorded encoders
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - name: fetch the corpus at a pinned commit
        run: |
          git clone --quiet https://github.com/http2jp/hpack-test-case "$RUNNER_TEMP/hpack-test-case"
          git -C "$RUNNER_TEMP/hpack-test-case" checkout --quiet 8a1406e7d14bfcb6c046021f13cc15cfb162726d
      - name: decode every story
        run: cargo test --release --test hpack_corpus -- --nocapture
        env:
          QUANTY_HPACK_CASES: ${{ runner.temp }}/hpack-test-case

  json-suite:
    name: JSON against JSONTestSuite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - name: fetch the suite at a pinned commit
        run: |
          git clone --quiet https://github.com/nst/JSONTestSuite "$RUNNER_TEMP/JSONTestSuite"
          git -C "$RUNNER_TEMP/JSONTestSuite" checkout --quiet 1ef36fa01286573e846ac449e8683f8833c5b26a
      - run: cargo test --release --test json_suite -- --nocapture
        env:
          QUANTY_JSON_SUITE: ${{ runner.temp }}/JSONTestSuite/test_parsing

  msrv:
    name: test on MSRV (1.89)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89
      - run: cargo test --workspace --locked

  # NIST ACVP and Wycheproof at pinned commits, CAVP by checksum. Bumping a pin is its own
  # commit, so a changed vector never arrives together with changed code.
  tls-vectors:
    name: TLS primitives against NIST ACVP, CAVP and Wycheproof
    runs-on: ubuntu-latest
    env:
      ACVP_COMMIT: 975de31eb83d87039ec88934fdc47d8c312b892d
      WYCHEPROOF_COMMIT: 7a325932231bd7a724c791c8b0d65ea4d6d2f435
      LIMBO_COMMIT: 554528a9b0c0d95e071f55de018326f0b65a8364
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - name: fetch the vector suites
        run: tests/tls_fetch_vectors.sh "$RUNNER_TEMP"
      - name: every vector, including the 1 to 8 GiB messages
        run: cargo test --release --test tls_vectors -- --nocapture
        env:
          QUANTY_VECTORS_REQUIRED: 1
          QUANTY_ACVP: ${{ runner.temp }}/acvp/gen-val/json-files
          QUANTY_WYCHEPROOF: ${{ runner.temp }}/wycheproof/testvectors_v1
          QUANTY_CAVP: ${{ runner.temp }}/cavp
          QUANTY_ACVP_LDT: 1
      - name: path validation against x509-limbo
        run: cargo test --release --test tls_limbo -- --nocapture
        env:
          QUANTY_VECTORS_REQUIRED: 1
          QUANTY_LIMBO: ${{ runner.temp }}/limbo/limbo.json
      - name: the handshake against the RFC 8448 traces
        run: cargo test --release --lib tls::rfc8448 -- --nocapture
        env:
          QUANTY_VECTORS_REQUIRED: 1
          QUANTY_RFC8448: ${{ runner.temp }}/rfc/rfc8448.txt

  tls-mutants:
    name: TLS tests fail on deliberately broken code
    runs-on: ubuntu-latest
    env:
      ACVP_COMMIT: 975de31eb83d87039ec88934fdc47d8c312b892d
      WYCHEPROOF_COMMIT: 7a325932231bd7a724c791c8b0d65ea4d6d2f435
      LIMBO_COMMIT: 554528a9b0c0d95e071f55de018326f0b65a8364
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - name: fetch the vector suites
        run: tests/tls_fetch_vectors.sh "$RUNNER_TEMP"
      - name: every mutant must be killed by its test
        run: tests/tls_mutants.py
        env:
          QUANTY_VECTORS_REQUIRED: 1
          QUANTY_ACVP: ${{ runner.temp }}/acvp/gen-val/json-files
          QUANTY_WYCHEPROOF: ${{ runner.temp }}/wycheproof/testvectors_v1
          QUANTY_CAVP: ${{ runner.temp }}/cavp
          QUANTY_RFC8448: ${{ runner.temp }}/rfc/rfc8448.txt
          QUANTY_LIMBO: ${{ runner.temp }}/limbo/limbo.json
          QUANTY_ACVP_LDT: 1

  # Timing is noisy on shared runners; the test only fails when two runs
  # in a row cross dudect's threshold, and its own counter check proves
  # in each run that the harness can see a leak at all.
  tls-timing:
    name: TLS primitives in constant time (dudect)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - name: timing of every secret handling primitive
        run: cargo test --release --test tls_timing -- --ignored --test-threads 1 --nocapture

  # Real sockets against OpenSSL and Go, both directions, with and without
  # client certificates, using certificates issued by this crate.
  tls-interop:
    name: TLS against OpenSSL and Go crypto/tls
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: handshakes and data with openssl and Go
        run: cargo test --release --test tls_interop -- --ignored --test-threads 1 --nocapture
      - name: chains issued here, verified by openssl
        run: |
          mkdir -p "$RUNNER_TEMP/ours"
          QUANTY_DUMP="$RUNNER_TEMP/ours" cargo test --release --lib dump_for_openssl -- --ignored
          cd "$RUNNER_TEMP/ours"
          openssl verify -CAfile root.pem -untrusted inter.pem -attime 1800000000 leaf.pem
      - name: chains issued by openssl, verified here
        run: |
          d="$RUNNER_TEMP/theirs"; mkdir -p "$d"; cd "$d"
          openssl genpkey -algorithm ed25519 -out ca.key
          openssl req -x509 -new -key ca.key -subj "/CN=OpenSSL Root" -days 30 \
            -addext "basicConstraints=critical,CA:TRUE" -addext "keyUsage=critical,keyCertSign" -out ca.pem
          openssl genpkey -algorithm ed25519 -out leaf.key
          openssl req -new -key leaf.key -subj "/CN=leaf" -out leaf.csr
          printf "basicConstraints=CA:FALSE\nkeyUsage=critical,digitalSignature\nextendedKeyUsage=serverAuth\nsubjectAltName=DNS:svc.example.test\n" > ext.cnf
          openssl x509 -req -in leaf.csr -CA ca.pem -CAkey ca.key -CAcreateserial -days 30 -extfile ext.cnf -out leaf.pem
          cd "$GITHUB_WORKSPACE"
          QUANTY_OPENSSL_CHAIN="$d" cargo test --release --lib verify_openssl_chain -- --ignored

  # A fresh seed per run, printed on failure, so new inputs are tried on
  # every run and every finding can be replayed.
  tls-fuzz:
    name: TLS parsers and connections fuzzed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - name: 200,000 cases per target
        run: cargo test --release --test tls_fuzz -- --nocapture
        env:
          QUANTY_FUZZ_SEED: ${{ github.run_id }}
          QUANTY_FUZZ_ITERS: 200000

  # Upstream's own parser tests, at the commit ADR-032 names: every case
  # marked to pass must pass, and refusals still owed by stages not yet
  # built are counted against a ceiling that only goes down.
  apparmor-simple:
    name: AppArmor against upstream's parser tests
    runs-on: ubuntu-latest
    env:
      APPARMOR_COMMIT: 909affc32a13d14ae3a7ccf44d325ae63ce11baf
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - name: fetch upstream at a pinned commit
        run: tests/apparmor_fetch.sh "$RUNNER_TEMP/apparmor"
      - name: simple_tests
        run: cargo test --release --test apparmor_simple -- --nocapture
        env:
          QUANTY_VECTORS_REQUIRED: 1
          QUANTY_APPARMOR_TST: ${{ runner.temp }}/apparmor/parser/tst
